<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Town 3D Asset POC</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #87d7f4; font-family: system-ui, sans-serif; }
    #app { width: 100vw; height: 100vh; }
    #hud {
      position: fixed; left: 12px; top: 12px; max-width: 420px;
      color: #10212e; background: rgba(255,255,255,.78); padding: 10px 12px; border-radius: 8px;
      font-size: 13px; line-height: 1.35; backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(18, 52, 67, .16);
    }
    #hud b { color: #0a5f86; }
    #hud kbd { background: rgba(16,33,46,.10); padding: 1px 5px; border-radius: 4px; }
    #status { margin-top: 6px; color: #4a6575; }
    #rotation-controls {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
      margin-top: 10px;
    }
    #rotation-controls label { display: grid; gap: 3px; font-weight: 700; }
    #rotation-controls span { font-size: 12px; }
    #rotation-controls input {
      width: 100%; box-sizing: border-box; border: 1px solid rgba(16,33,46,.18);
      border-radius: 6px; padding: 5px 6px; color: #10212e; background: rgba(255,255,255,.78);
      font: 600 14px system-ui, sans-serif;
    }
    .axis-x span { color: #b92f2f; }
    .axis-y span { color: #1f7f42; }
    .axis-z span { color: #2359b6; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <b>Pixel Town Clean Shrine</b><br>
    Drag to orbit. Scroll to zoom. Press <kbd>R</kbd> to reset. Axes: X red, Y green, Z blue.
    <div id="rotation-controls">
      <label class="axis-x"><span>X deg</span><input id="x-rotation" type="number" value="-90" step="15"></label>
      <label class="axis-y"><span>Y deg</span><input id="y-rotation" type="number" value="0" step="15"></label>
      <label class="axis-z"><span>Z deg</span><input id="z-rotation" type="number" value="45" step="15"></label>
    </div>
    <div id="status">Loading cleaned GLB...</div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
